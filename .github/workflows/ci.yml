name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Fails if course JSON is invalid or was edited without a seed migration.
      - name: Course seeds
        run: npx tsx scripts/seed-courses.ts --check

      # Every data route renders at request time, so the build never talks to
      # Supabase — placeholders are enough and CI needs no secrets.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          NEXT_TELEMETRY_DISABLED: 1

  # Replays every migration into a throwaway local Postgres and runs the pgTAP
  # RLS / integrity tests in supabase/tests.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Start database (applies all migrations)
        run: supabase db start

      - name: Database tests
        run: supabase test db

  # Clicks through the real app (production build) in a phone-sized Chromium,
  # against a throwaway local Supabase stack. See e2e/ and playwright.config.ts.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Start Supabase (applies all migrations)
        run: npx supabase start -x studio,edge-runtime,vector,logflare,imgproxy,supavisor

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload report (screenshots + traces)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
